<!DOCTYPE html>
<html>
<head>
  <title>💬 Simple Web Chat</title>
  <script src="https://cdn.socket.io/4.3.2/socket.io.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
    }
    #sidebar {
      width: 200px;
      background-color: #f0f0f0;
      padding: 10px;
      border-right: 1px solid #ccc;
    }
    #sidebar h3 {
      text-align: center;
    }
    #users {
      list-style: none;
      padding: 0;
    }
    #users li {
      padding: 5px;
      border-bottom: 1px solid #ddd;
    }
    #chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }
    #chat-box {
      flex: 1;
      border: 1px solid #ccc;
      padding: 10px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    #msg {
      width: 80%;
      padding: 8px;
    }
    #send-btn {
      padding: 8px 15px;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h3>🟢 Online</h3>
    <ul id="users"></ul>
  </div>

  <div id="chat-container">
    <h2>💬 Simple Chat (with Private Messaging)</h2>
    <div id="chat-box"></div>
    <div>
      <input id="msg" placeholder="Type a message or /pm user message" />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    const socket = io();
    const chatBox = document.getElementById('chat-box');
    const msgInput = document.getElementById('msg');
    const sendBtn = document.getElementById('send-btn');
    const usersList = document.getElementById('users');

    let username = prompt("Enter your username:");
    socket.emit('set_username', username);

    socket.on('message', (data) => {
      chatBox.innerHTML += `<p>${data}</p>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    socket.on('user_list', (usernames) => {
      usersList.innerHTML = '';
      usernames.forEach(u => {
        const li = document.createElement('li');
        li.textContent = u;
        if (u === username) li.style.fontWeight = 'bold';
        usersList.appendChild(li);
      });
    });

    sendBtn.onclick = () => {
      const msg = msgInput.value.trim();
      if (msg !== "") {
        socket.send(msg);
        msgInput.value = '';
      }
    };

    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });
  </script>
</body>
</html>
